name: Dagelijkse Citatie Tracker

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 10:00 Amsterdam
  workflow_dispatch:        # Handmatig starten via GitHub UI

permissions:
  contents: write

jobs:
  fetch-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Script uitvoeren
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python fetch_citations.py

      - name: CSV committen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add citations.csv
          git diff --staged --quiet || git commit -m "📊 Citaties bijgewerkt: $(date '+%Y-%m-%d')"
          git push
